name: CI Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  check-project:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Check index.html
        run: test -f index.html

      - name: Check style.css
        run: test -f style.css

      - name: Check script.js
        run: test -f script.js

      - name: Success message
        run: echo "All project files are present!"
